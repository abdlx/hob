name: Portal desktop diagnostic
on:
  push:
    branches: ['fix/portal-desktop-startup']
    paths: ['.github/workflows/portal-desktop-diagnostic.yml', 'Dockerfile', 'deploy/probe-portal-desktop.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag hob:portal-diag .
      - name: Launch desktop as production runtime user
        run: docker run --rm --user 10000:10000 --env HOB_SMOKE_PORTAL=1 --entrypoint /usr/local/bin/node hob:portal-diag /app/deploy/probe-portal-desktop.mjs
