services:
  muse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_BROWSER: "1"
        OPENCLAW_BUILD_MEMORY_MB: "6144"
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      # Coolify generates these once and preserves them across redeployments.
      SERVICE_URL_MUSE_3000: /
      MUSE_PASSWORD: ${SERVICE_PASSWORD_64_MUSE}
      MUSE_SESSION_SECRET: ${SERVICE_REALBASE64_64_MUSE}
      MUSE_SECURE_COOKIES: ${MUSE_SECURE_COOKIES:-false}
      # Override when an external TLS proxy or older Coolify changes the origin.
      MUSE_PUBLIC_URL: ${MUSE_PUBLIC_URL:-${SERVICE_URL_MUSE_3000}}
    # Coolify's proxy routes to this port. No fixed host port is published.
    expose:
      - "3000"
    volumes:
      - muse-data:/data
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Compose reads this file on its client, not inside the app container.
      # In Coolify, enable Preserve Repository During Deployment for restarts.
      - seccomp=./deploy/chromium-seccomp.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  muse-data:
