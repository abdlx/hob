name: Coolify image first run

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.isolation.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/coolify-build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.isolation.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/coolify-build.yml'

permissions:
  contents: read

concurrency:
  group: coolify-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      # Match npm in the digest-pinned Docker build image. Older npm accepted
      # an incomplete optional WASM bundle tree that npm 11.19 rejects in ci.
      - name: Use the Docker build's npm version
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  first-run:
    # Ubuntu 22.04 supports Chromium user namespaces without Ubuntu 24.04's
    # additional AppArmor restriction. No sandbox or seccomp bypass is applied.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Build the single image from this checkout
        run: docker build --tag openmuse:ci .
      - name: Verify first boot, sandboxed browser, and persistence
        env:
          MUSE_SMOKE_IMAGE: openmuse:ci
          MUSE_SMOKE_ISOLATION: ${{ github.ref_name == 'codex/bot-os-isolation' && 'users' || 'shared' }}
        shell: bash
        run: |
          set +e
          node deploy/smoke-container.mjs 2>&1 | tee "$RUNNER_TEMP/container-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            printf '### Container smoke (exit %s)\n\n```text\n' "$status"
            tail -c 2000 "$RUNNER_TEMP/container-smoke.log"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 2000 "$RUNNER_TEMP/container-smoke.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=container smoke::%s\n' "$detail"
          fi
          exit "$status"
