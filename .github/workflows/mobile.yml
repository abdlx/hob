name: Mobile app validation
on:
  push:
    paths: ['mobile/**', 'web/**', 'server/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'web/**', 'server/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-ios-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
        env:
          CI: '1'
      - run: npm run bundle:check
      - run: npx expo prebuild --no-install --platform android
      - run: npx expo config --type introspect --json > /tmp/hob-native-config.json
  android-preview:
    # An account-free, arm64 phone preview signed with the generated debug key.
    # Store builds and APNs/FCM credentials remain owned by the user's EAS project.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --no-install --platform android
      - name: Install the pinned React Native SDK and NDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Compile an installable phone preview
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hob-android-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
