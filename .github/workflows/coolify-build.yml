name: Coolify image first run

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.isolation.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/coolify-build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.isolation.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/coolify-build.yml'

permissions:
  contents: read

concurrency:
  group: coolify-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      # Match npm in the digest-pinned Docker build image. Older npm accepted
      # an incomplete optional WASM bundle tree that npm 11.19 rejects in ci.
      - name: Use the Docker build's npm version
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  server-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - run: npm install --global npm@11.19.0 --no-audit --no-fund
      - run: npm ci --prefix server
      - name: Server tests with inspectable failure evidence
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec --test-concurrency=2 server/test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/server-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 6000 "$RUNNER_TEMP/server-tests.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=server test failures::%s\n' "$detail"
          fi
          exit "$status"
      - run: node --test deploy/*.test.mjs
      - run: python3 deploy/test-native-controls.py
  first-run:
    name: first-run (${{ matrix.isolation }})
    strategy:
      fail-fast: false
      matrix:
        isolation: [shared, users]
    # Ubuntu 22.04 supports Chromium user namespaces without Ubuntu 24.04's
    # additional AppArmor restriction. No sandbox or seccomp bypass is applied.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Build the single image from this checkout
        run: docker build --build-arg HOB_GIT_COMMIT="$GITHUB_SHA" --build-arg HOB_GIT_REF="$GITHUB_REF_NAME" --tag hob:ci .
      - name: Execute team adapter tests against exact pinned native sources
        # The installer checks the upstream digests itself. Keep a pristine copy
        # from the pinned base image for the optional source-level hook probes.
        shell: bash
        run: |
          native_base=$(sed -n 's/^ARG HERMES_IMAGE=//p' Dockerfile)
          test -n "$native_base"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python -v "$PWD/deploy:/hob-team-tests:ro" -e HOB_QUALIFIED_RUNTIME=/opt/hermes "$native_base" /hob-team-tests/test-team-context.py
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python -v "$PWD/deploy:/hob-team-tests:ro" -e HOB_QUALIFIED_RUNTIME=/opt/hermes "$native_base" /hob-team-tests/test-native-activity-pinned.py
      - name: Verify first boot, sandboxed browser, and persistence
        env:
          HOB_SMOKE_IMAGE: hob:ci
          HOB_SMOKE_ISOLATION: ${{ matrix.isolation }}
          HOB_SMOKE_EXPECT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          node deploy/smoke-container.mjs 2>&1 | tee "$RUNNER_TEMP/container-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            printf '### Container smoke (exit %s)\n\n```text\n' "$status"
            tail -c 2000 "$RUNNER_TEMP/container-smoke.log"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 2000 "$RUNNER_TEMP/container-smoke.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=container smoke::%s\n' "$detail"
          fi
          exit "$status"
