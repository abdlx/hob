services:
  hob:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Coolify exports the checked-out commit and branch to the build. The
        # running app reports them at /api/version, /healthz and in its startup
        # log, so a manual deploy can be verified against the intended commit.
        HOB_GIT_COMMIT: ${SOURCE_COMMIT:-${HOB_GIT_COMMIT:-unknown}}
        HOB_GIT_REF: ${COOLIFY_BRANCH:-unknown}
        HOB_BUILD_TIME: ${HOB_BUILD_TIME:-unknown}
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      # Coolify generates these once and preserves them across redeployments.
      SERVICE_URL_HOB_3000: /
      HOB_PASSWORD: ${SERVICE_PASSWORD_64_HOB}
      HOB_SESSION_SECRET: ${SERVICE_REALBASE64_64_HOB}
      HOB_SECURE_COOKIES: ${HOB_SECURE_COOKIES:-false}
      HOB_CAPTCHA: ${HOB_CAPTCHA:-human}
      # Optional Expo push access token when enhanced push security is enabled.
      HOB_EXPO_ACCESS_TOKEN: ${HOB_EXPO_ACCESS_TOKEN:-}
      # Override when an external TLS proxy or older Coolify changes the origin.
      HOB_PUBLIC_URL: ${HOB_PUBLIC_URL:-${SERVICE_URL_HOB_3000}}
    # Coolify's proxy routes to this port. No fixed host port is published.
    expose:
      - "3000"
    volumes:
      - hermes-data:/opt/data
    shm_size: "1gb"
    cap_drop:
      - ALL
    # The official image initializes volume ownership and drops to UID 10000.
    # Agent/web processes run unprivileged after this stock initialization.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
    security_opt:
      - no-new-privileges:true
      # Compose reads this file on its client, not inside the app container.
      # In Coolify, enable Preserve Repository During Deployment for restarts.
      - seccomp=./deploy/chromium-seccomp.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hermes-data:
