name: Coolify image first run

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - 'openclaw/**'
      - '.github/workflows/coolify-build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/**'
      - 'server/**'
      - 'web/**'
      - 'openclaw/**'
      - '.github/workflows/coolify-build.yml'

permissions:
  contents: read

concurrency:
  group: coolify-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-run:
    # Ubuntu 22.04 supports Chromium user namespaces without Ubuntu 24.04's
    # additional AppArmor restriction. No sandbox or seccomp bypass is applied.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the complete app and modified backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Build the single image from this checkout
        run: docker build --build-arg OPENCLAW_BUILD_MEMORY_MB=4096 --tag openmuse:ci .
      - name: Verify first boot, sandboxed browser, and persistence
        env:
          MUSE_SMOKE_IMAGE: openmuse:ci
        run: node deploy/smoke-container.mjs
